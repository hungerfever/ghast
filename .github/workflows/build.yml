name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          unzip -q ghastbases-source.zip
          cd ghastbases
          chmod +x gradlew
          python make_mrpack.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghast-bases
          path: |
            ghastbases/*.mrpack
            ghastbases/build/libs/ghastbases-*.jar
